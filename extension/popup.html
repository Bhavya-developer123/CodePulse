<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodePulse</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>

<body>

    <div class="popup-container">

        <!-- ================================= -->
        <!-- BRAND -->
        <!-- ================================= -->

        <div class="brand">

            <div class="logo">
                ⚡
            </div>

            <div class="brand-text">

                <h1>
                    CodePulse
                </h1>

                <p>
                    Track. Improve. Grow.
                </p>

            </div>

        </div>


        <!-- ================================= -->
        <!-- LOGIN -->
        <!-- ================================= -->

        <section
            id="authSection"
            class="section"
        >

            <div class="auth-status">

                <span
                    class="status-dot disconnected"
                ></span>

                Not Connected

            </div>


            <div class="section-label">
                Connect your CodePulse account
            </div>


            <p class="auth-description">

                Sign in once to connect your
                CodePulse account.

            </p>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    placeholder="Enter your email"
                >

                <p
                    id="emailError"
                    class="error"
                ></p>

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>


                <div class="password-container">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >

                    <button
                        id="togglePassword"
                        type="button"
                        class="password-toggle"
                    >
                        Show
                    </button>

                </div>


                <p
                    id="passwordError"
                    class="error"
                ></p>

            </div>


            <button
                id="connectButton"
                type="button"
                class="primary-button"
            >
                🔐 Connect to CodePulse
            </button>


            <p
                id="authMessage"
                class="message"
            ></p>

        </section>


        <!-- ================================= -->
        <!-- CONNECTED -->
        <!-- ================================= -->

        <section
            id="connectedSection"
            class="section"
            hidden
        >

            <div class="auth-status">

                <span
                    class="status-dot connected"
                ></span>

                Connected

            </div>


            <!-- USER -->

            <div class="user-card">

                <div class="user-avatar">
                    B
                </div>

                <div>

                    <p class="user-label">
                        CodePulse Account
                    </p>

                    <h3 id="connectedEmail">
                    </h3>

                </div>

            </div>


            <!-- ================================= -->
            <!-- PROBLEM -->
            <!-- ================================= -->

            <div class="problem-section">

                <div class="section-label">
                    Detected Problem
                </div>


                <div id="problemContainer">

                    <p class="loading">
                        Reading current page...
                    </p>

                </div>

            </div>


            <!-- ================================= -->
            <!-- ADD -->
            <!-- ================================= -->

            <button
                id="addProblemButton"
                type="button"
                class="primary-button"
                disabled
            >
                + Add Problem
            </button>


            <p
                id="message"
                class="message"
            ></p>


            <!-- ================================= -->
            <!-- DISCONNECT -->
            <!-- ================================= -->

            <button
                id="disconnectButton"
                type="button"
                class="disconnect-button"
            >
                Disconnect
            </button>

        </section>


        <div class="footer">
            CodePulse • Your coding journey
        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
