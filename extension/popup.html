<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodePulse</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>

<body>

    <div class="popup-container">

        <!-- BRAND -->

        <div class="brand">

            <div class="logo">
                ⚡
            </div>

            <div class="brand-text">

                <h1>CodePulse</h1>

                <p>
                    Track. Improve. Grow.
                </p>

            </div>

        </div>


        <!-- STATUS -->

        <div class="status">

            <span class="status-dot"></span>

            Extension Ready

        </div>


        <!-- PROBLEM -->

        <div class="problem-section">

            <div class="section-label">
                Detected Problem
            </div>

            <div id="problemContainer">

                <p class="loading">
                    Reading current page...
                </p>

            </div>

        </div>


        <!-- ACTION -->

        <button
            id="addProblemButton"
            disabled
        >
            + Add Problem
        </button>


        <p id="message"></p>


        <!-- FOOTER -->

        <div class="footer">
            CodePulse • Your coding journey
        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
